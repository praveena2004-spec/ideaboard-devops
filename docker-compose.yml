# Local development stack: PostgreSQL + FastAPI backend + React/nginx frontend.
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD (and optionally ANTHROPIC_API_KEY)
#   docker compose up --build
#   open http://localhost:3000
#
# Values come from .env; nothing secret is written in this file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideaboard}
      POSTGRES_USER: ${POSTGRES_USER:-ideaboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The backend waits for this check to pass before starting.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ideaboard}
      POSTGRES_USER: ${POSTGRES_USER:-ideaboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Optional: leave empty to use the rule-based analyzer.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      SIMULATE_UNHEALTHY: ${SIMULATE_UNHEALTHY:-false}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"   # exposed for API testing / Swagger UI at /docs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
