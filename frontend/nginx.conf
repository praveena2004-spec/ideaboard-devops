# Serves the React build and reverse-proxies /api to the backend.
# "backend" is the Docker Compose service name AND the Kubernetes Service
# name, so this one file works in both environments.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Log analysis requests can carry large log excerpts.
    client_max_body_size 2m;

    # Liveness/readiness endpoint for the frontend container itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # LLM calls can take tens of seconds.
        proxy_read_timeout 180s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
