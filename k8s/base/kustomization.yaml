# Base manifests shared by every environment and every cloud. They contain
# nothing cloud-specific: the database location arrives at deploy time in the
# `ideaboard-db` Secret (RDS on AWS, Cloud SQL on GCP, in-cluster Postgres locally).
# Environment differences live in overlays/<env>/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: ideaboard
    includeSelectors: false

resources:
  - backend.yaml
  - frontend.yaml

# Non-secret settings. The generated name gets a content hash, so changing a
# value triggers a rolling restart automatically (and is rolled back with the code).
configMapGenerator:
  - name: backend-config
    literals:
      - APP_ENV=development
      - AI_MODEL=claude-opus-5-5
      - SIMULATE_UNHEALTHY=false

# Secrets are NOT stored in git. scripts/deploy.sh creates them per namespace
# from environment variables (GitHub Secrets in CI / Terraform outputs):
#   ideaboard-db: POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   ideaboard-ai: ANTHROPIC_API_KEY   (optional)
