apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ideaboard-staging

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_ENV=staging

replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1

# The pipeline replaces these with the images it just built, e.g.
#   kustomize edit set image ideaboard-backend=ghcr.io/<owner>/ideaboard-backend:<sha>
images:
  - name: ideaboard-backend
    newName: ghcr.io/OWNER/ideaboard-backend
    newTag: latest
  - name: ideaboard-frontend
    newName: ghcr.io/OWNER/ideaboard-frontend
    newTag: latest
